<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #0066cc;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0066cc;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .banner {
      text-align: center;
      margin-bottom: 20px;
    }
    .banner img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- Banner aparece em todas as páginas -->
  <div class="banner">
    <img src="/assets/logo.png" alt="Arte-Tech Banner">
  </div>

  <!-- Aqui entra o conteúdo específico de cada página -->
  {{ content }}
</body>
</html>
